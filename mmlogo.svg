<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Háttér lekerekített négyzet -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="#181e24"/>
  
  <!-- Naptár keret (Outlined) -->
  <rect x="96" y="112" width="320" height="300" rx="24" fill="none" stroke="#e0e6ed" stroke-width="20"/>
  
  <!-- Naptár akasztók/gyűrűk -->
  <line x1="160" y1="80" x2="160" y2="128" stroke="#e0e6ed" stroke-width="20" stroke-linecap="round"/>
  <line x1="352" y1="80" x2="352" y2="128" stroke="#e0e6ed" stroke-width="20" stroke-linecap="round"/>
  
  <!-- Naptár felső elválasztó vonal -->
  <line x1="96" y1="180" x2="416" y2="180" stroke="#e0e6ed" stroke-width="16"/>
  
  <!-- Trikolór sáv a naptár alsó részén -->
  <g clip-path="url(#calendar-clip)">
    <!-- Piros csík -->
    <rect x="128" y="320" width="256" height="16" fill="#ce2939"/>
    <!-- Fehér csík -->
    <rect x="128" y="336" width="256" height="16" fill="#ffffff"/>
    <!-- Zöld csík -->
    <rect x="128" y="352" width="256" height="16" fill="#477050"/>
  </g>
  
  <!-- Belső naptár rács pontok/vonalak (minimalista elrendezés) -->
  <circle cx="160" cy="236" r="12" fill="#e0e6ed"/>
  <circle cx="224" cy="236" r="12" fill="#e0e6ed"/>
  <circle cx="288" cy="236" r="12" fill="#e0e6ed"/>
  <circle cx="352" cy="236" r="12" fill="#e0e6ed"/>
  
  <circle cx="160" cy="280" r="12" fill="#e0e6ed"/>
  <circle cx="224" cy="280" r="12" fill="#e0e6ed"/>
  <circle cx="288" cy="280" r="12" fill="#e0e6ed"/>
  <circle cx="352" cy="280" r="12" fill="#38a169"/> <!-- Zöld munkanap jelzés -->

  <!-- Clip-path a trikolórhoz -->
  <clipPath id="calendar-clip">
    <rect x="128" y="320" width="256" height="48" rx="8"/>
  </clipPath>
</svg>
